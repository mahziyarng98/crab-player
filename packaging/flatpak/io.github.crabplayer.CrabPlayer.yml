# Flatpak manifest — skeleton. UNTESTED: it has never been built.
#
# Before building:
#   1. Replace the git URL below with the real repository and pin the commit.
#   2. Generate the cargo sources file, otherwise the offline build has no
#      crate registry:
#        flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
#   3. `flatpak-builder --user --install --force-clean build-dir \
#        packaging/flatpak/io.github.crabplayer.CrabPlayer.yml`
#
# The runtime provides FFmpeg and VA-API; mpv is built here only for
# libmpv.so.2, with the command line player and scripting disabled.

app-id: io.github.crabplayer.CrabPlayer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: crab-player

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.portal.Desktop

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/crab-player/cargo

modules:
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Ddocs=disabled
      - -Dbuild-date=false
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.40.0
        commit: 0000000000000000000000000000000000000000  # pin on first build

  - name: crab-player
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/crab-player /app/bin/crab-player
      # Flatpak requires the exported desktop file and icon to be named after
      # the app-id. The binary announces the Wayland app id `crab-player`, so
      # whether the taskbar icon matches must be checked on the first build.
      - install -Dm644 packaging/crab-player.desktop
        /app/share/applications/io.github.crabplayer.CrabPlayer.desktop
      - desktop-file-edit --set-icon=io.github.crabplayer.CrabPlayer
        /app/share/applications/io.github.crabplayer.CrabPlayer.desktop
      - install -Dm644 assets/icons/hicolor/256x256/apps/crab-player.png
        /app/share/icons/hicolor/256x256/apps/io.github.crabplayer.CrabPlayer.png
      - install -Dm644 assets/icons/hicolor/128x128/apps/crab-player.png
        /app/share/icons/hicolor/128x128/apps/io.github.crabplayer.CrabPlayer.png
      - install -Dm644 assets/icons/hicolor/64x64/apps/crab-player.png
        /app/share/icons/hicolor/64x64/apps/io.github.crabplayer.CrabPlayer.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.crabplayer.CrabPlayer/LICENSE
    sources:
      - type: dir
        path: ../..
      - type: file
        path: cargo-sources.json
