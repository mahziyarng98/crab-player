name: Release

# Pushing a version tag (v0.1.0, …) builds every package and publishes them,
# with SHA-256 sums, as a GitHub release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage and tarball (Ubuntu 22.04, glibc 2.35)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          CRAB_SRC: ${{ github.workspace }}
          CRAB_DIST: ${{ github.workspace }}/dist
          CRAB_CACHE: /tmp/cache
        run: bash packaging/appimage/build.sh --inside
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/*
          if-no-files-found: error

  deb:
    name: .deb (Debian 12)
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          CRAB_SRC: ${{ github.workspace }}
          CRAB_DIST: ${{ github.workspace }}/dist
        run: bash packaging/debian/build.sh --inside
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*
          if-no-files-found: error

  rpm:
    name: .rpm (Fedora 45)
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          CRAB_SRC: ${{ github.workspace }}
          CRAB_DIST: ${{ github.workspace }}/dist
        run: bash packaging/rpm/build.sh --inside
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: dist/*
          if-no-files-found: error

  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust mpv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (makepkg refuses to run as root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && packaging/arch/build-local.sh '$GITHUB_WORKSPACE/dist'"
          rm -f dist/PKGBUILD dist/*.tar.gz
          (cd dist && sha256sum ./*.pkg.tar.zst > "$(ls ./*.pkg.tar.zst | head -1).sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: dist/*.pkg.tar.zst*
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    # Best effort: a Flatpak problem does not hold back the other packages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends flatpak flatpak-builder
          # bubblewrap needs unprivileged user namespaces, which Ubuntu
          # 24.04 restricts through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: packaging/flatpak/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [appimage, deb, rpm, arch, flatpak]
    # Runs when the required packages built, even if the Flatpak did not.
    if: ${{ !cancelled() && needs.appimage.result == 'success' && needs.deb.result == 'success' && needs.rpm.result == 'success' && needs.arch.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          rm -f ./*.sha256
          sha256sum ./* | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "Crab Player ${TAG#v}" --generate-notes --verify-tag
