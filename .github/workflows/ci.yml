name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The minimum supported Rust version (Cargo.toml rust-version).
  RUST_VERSION: "1.95.0"

jobs:
  check:
    name: fmt, clippy, tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mpv
            features: ""
          - name: no mpv
            features: --no-default-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt-install
        with:
          packages: libmpv-dev pkg-config
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt,clippy
          rustup default "$RUST_VERSION"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Tests
        run: cargo test --locked ${{ matrix.features }}
      - name: libmpv is loaded at runtime, not linked
        if: matrix.features == ''
        run: |
          cargo build --locked
          if readelf -d target/debug/crab-player | grep 'NEEDED.*libmpv'; then
            echo "::error::crab-player links libmpv directly; the runtime loader shim is not in effect"
            exit 1
          fi

  metadata:
    name: desktop entry and AppStream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt-install
        with:
          packages: appstream desktop-file-utils shellcheck
      - name: Validate
        run: |
          desktop-file-validate packaging/io.github.mahziyarng98.crab-player.desktop
          appstreamcli validate --no-net packaging/io.github.mahziyarng98.crab-player.metainfo.xml
      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/*.sh packaging/*.sh packaging/*/build.sh packaging/arch/build-local.sh
