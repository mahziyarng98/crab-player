name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The minimum supported Rust version (Cargo.toml rust-version).
  RUST_VERSION: "1.95.0"

jobs:
  check:
    name: fmt, clippy, tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mpv
            features: ""
          - name: no mpv
            features: --no-default-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # The ubuntu-24.04 image sends apt to azure.archive.ubuntu.com,
          # which does not resolve from every runner pool: each lookup hung
          # ~26 s and apt tried it four times per repository, so the job sat
          # here for twelve minutes and then failed. Point apt at the
          # canonical archive first and bound every call, so a network
          # problem fails fast (and visibly) instead of hanging.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt || true
          getent hosts archive.ubuntu.com >/dev/null ||
            echo "::warning::archive.ubuntu.com does not resolve either"
          sudo timeout 180 apt-get update -qq \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo timeout 300 apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            libmpv-dev pkg-config
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt,clippy
          rustup default "$RUST_VERSION"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Tests
        run: cargo test --locked ${{ matrix.features }}
      - name: libmpv is loaded at runtime, not linked
        if: matrix.features == ''
        run: |
          cargo build --locked
          if readelf -d target/debug/crab-player | grep 'NEEDED.*libmpv'; then
            echo "::error::crab-player links libmpv directly; the runtime loader shim is not in effect"
            exit 1
          fi

  metadata:
    name: desktop entry and AppStream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Network diagnostics
        run: |
          for h in archive.ubuntu.com deb.debian.org mirrors.edge.kernel.org; do
            printf '%-26s v4: ' "$h"
            timeout 5 getent ahostsv4 "$h" | head -1 || echo "(none)"
          done
          for u in https://deb.debian.org/debian/ \
                   https://static.rust-lang.org/ \
                   https://static.crates.io/ \
                   https://mirrors.edge.kernel.org/ubuntu/ \
                   https://ftp.osuosl.org/pub/ubuntu/ \
                   https://mirror.math.princeton.edu/pub/ubuntu/ \
                   https://registry-1.docker.io/v2/ ; do
            curl -sS -m 15 -o /dev/null -w "%{http_code} $u\n" "$u" || true
          done
      - name: Install validators
        run: |
          set -euo pipefail
          # See the apt comment in the check job above.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt || true
          sudo timeout 180 apt-get update -qq \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo timeout 300 apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            appstream desktop-file-utils shellcheck
      - name: Validate
        run: |
          desktop-file-validate packaging/io.github.mahziyarng98.CrabPlayer.desktop
          appstreamcli validate --no-net packaging/io.github.mahziyarng98.CrabPlayer.metainfo.xml
      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/*.sh packaging/*.sh packaging/*/build.sh packaging/arch/build-local.sh
