name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The minimum supported Rust version (Cargo.toml rust-version).
  RUST_VERSION: "1.95.0"

jobs:
  check:
    name: fmt, clippy, tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mpv
            features: ""
          - name: no mpv
            features: --no-default-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # The ubuntu-24.04 image sends apt to azure.archive.ubuntu.com, and
          # from these runners neither that host nor archive.ubuntu.com
          # resolves: every lookup hung ~26 s, apt repeated it once per
          # repository, and the job sat here for twelve minutes before it
          # even failed. Use a mirror that does resolve here (checked with
          # curl before this job) and bound every call, so a network
          # problem fails in minutes instead of hanging.
          sudo sed -i \
            -e 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' \
            -e 's|security\.ubuntu\.com|mirrors.edge.kernel.org|g' \
            /etc/apt/apt-mirrors.txt || true
          sudo timeout 180 apt-get update -qq \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo timeout 300 apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            libmpv-dev pkg-config
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt,clippy
          rustup default "$RUST_VERSION"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Tests
        run: cargo test --locked ${{ matrix.features }}
      - name: libmpv is loaded at runtime, not linked
        if: matrix.features == ''
        run: |
          cargo build --locked
          if readelf -d target/debug/crab-player | grep 'NEEDED.*libmpv'; then
            echo "::error::crab-player links libmpv directly; the runtime loader shim is not in effect"
            exit 1
          fi

  metadata:
    name: desktop entry and AppStream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validators
        run: |
          set -euo pipefail
          # See the apt comment in the check job above.
          sudo sed -i \
            -e 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' \
            -e 's|security\.ubuntu\.com|mirrors.edge.kernel.org|g' \
            /etc/apt/apt-mirrors.txt || true
          sudo timeout 180 apt-get update -qq \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo timeout 300 apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            appstream desktop-file-utils shellcheck
      - name: Validate
        run: |
          desktop-file-validate packaging/io.github.mahziyarng98.CrabPlayer.desktop
          appstreamcli validate --no-net packaging/io.github.mahziyarng98.CrabPlayer.metainfo.xml
      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/*.sh packaging/*.sh packaging/*/build.sh packaging/arch/build-local.sh
