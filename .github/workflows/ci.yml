name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The minimum supported Rust version (Cargo.toml rust-version).
  RUST_VERSION: "1.95.0"

jobs:
  check:
    name: fmt, clippy, tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mpv
            features: ""
          - name: no mpv
            features: --no-default-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # The ubuntu-24.04 image resolves apt through
          # azure.archive.ubuntu.com, which intermittently fails to resolve on
          # hosted runners ("Temporary failure resolving …"). Retry with
          # bounded timeouts and fall back to the canonical Ubuntu mirror, so
          # a mirror problem fails the job instead of hanging it.
          apt() {
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 "$@"
          }
          for attempt in 1 2 3; do
            if apt update -qq && apt install -y -qq --no-install-recommends \
                libmpv-dev pkg-config; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying with archive.ubuntu.com"
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
              /etc/apt/apt-mirrors.txt || true
            sleep 10
          done
          echo "::error::could not install the build dependencies"
          exit 1
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt,clippy
          rustup default "$RUST_VERSION"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Tests
        run: cargo test --locked ${{ matrix.features }}
      - name: libmpv is loaded at runtime, not linked
        if: matrix.features == ''
        run: |
          cargo build --locked
          if readelf -d target/debug/crab-player | grep 'NEEDED.*libmpv'; then
            echo "::error::crab-player links libmpv directly; the runtime loader shim is not in effect"
            exit 1
          fi

  metadata:
    name: desktop entry and AppStream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validators
        run: |
          set -euo pipefail
          # See the apt comment in the check job above.
          apt() {
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 "$@"
          }
          for attempt in 1 2 3; do
            if apt update -qq && apt install -y -qq --no-install-recommends \
                appstream desktop-file-utils shellcheck; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying with archive.ubuntu.com"
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
              /etc/apt/apt-mirrors.txt || true
            sleep 10
          done
          echo "::error::could not install the validators"
          exit 1
      - name: Validate
        run: |
          desktop-file-validate packaging/io.github.mahziyarng98.CrabPlayer.desktop
          appstreamcli validate --no-net packaging/io.github.mahziyarng98.CrabPlayer.metainfo.xml
      - name: Shell scripts
        # Informational until the scripts have had a clean shellcheck run.
        continue-on-error: true
        run: |
          shellcheck -S warning scripts/*.sh packaging/*.sh packaging/*/build.sh packaging/arch/build-local.sh
